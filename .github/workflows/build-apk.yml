name: Build WoW Forever APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses
        run: yes | sdkmanager --licenses || true

      - name: Install NDK and platform
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.3.13750724" "platform-tools"

      - name: Fetch components
        run: |
          chmod +x tools/fetch_components.sh
          ./tools/fetch_components.sh

      - name: Build modern debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleModernDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WoW-Forever-RG477M-experimental
          path: app/build/outputs/apk/modern/debug/*.apk
          retention-days: 14
