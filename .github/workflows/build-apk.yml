name: Build WoW Forever APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.3.13750724" "platform-tools"
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Fetch components
        run: |
          chmod +x tools/fetch_components.sh
          ./tools/fetch_components.sh

      - name: Build modern debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleModernDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WoW-Forever-RG477M-experimental
          path: app/build/outputs/apk/modern/debug/*.apk
          retention-days: 14
